# Ruff config - the project lint gate (CI + local).
# Reviewed-intentional ignores:
#   C408   - dict(...) calls in matplotlib/plotly/_SPEC are idiomatic here
#   BLE001 - broad excepts in UI/report/pipeline are deliberate fail-safe
#            boundaries (a rendering error must never kill a run)
#   DTZ005 - local naive datetimes intended for run folder names + report date
#   ISC004 - all 8 sites verified as intentional single-element string splits
#   PLR2004/0912/0913/0915/0917 - engineering constants + long pipeline
#            functions are intentional in this domain
#   SIM108 - ternary rewrites add no clarity here
#   B905   - zip sites all pair equal-length sequences
#   E741   - plotly margin/layout keys require single-letter names
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "ISC", "BLE", "DTZ", "RUF",
          "SIM", "PLR"]
ignore = ["C408", "BLE001", "DTZ005", "ISC004", "PLR2004", "PLR0912",
          "PLR0913", "PLR0915", "PLR0917", "SIM108", "B905", "E741"]

[lint.per-file-ignores]
# sys.path bootstrap must run before package imports in the app entry script
"ui/*" = ["E402"]
"tests/*" = ["E402"]
